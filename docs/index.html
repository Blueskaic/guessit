<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15112a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GuessIt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>GuessIt</title>
<style>
:root { --bg:#15112a; --panel:#241d45; --muted:#b3acd6; --a1:#ff4f8b; --a2:#ffb03a; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:#fff; font-family:system-ui, "Noto Sans Hebrew", Arial, sans-serif; }
button { font:inherit; color:inherit; border:0; background:none; }
.screen { position:fixed; inset:0; display:none; flex-direction:column; }
.screen.on { display:flex; }

/* home */
header { display:flex; align-items:center; gap:10px; padding:10px 20px; flex-wrap:wrap; }
.logo { direction:ltr; font-size:28px; font-weight:900; background:linear-gradient(90deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.grow { flex:1; }
.pill { background:var(--panel); padding:9px 16px; border-radius:999px; font-size:14px; font-weight:700; }
#grid { flex:1; overflow-y:auto; padding:4px 20px 96px; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; align-content:start; }
.cat { position:relative; height:clamp(110px, 30vh, 150px); border-radius:16px; overflow:hidden; background:var(--panel) 50% 20%/cover; box-shadow:inset 0 0 0 3px transparent; transition:transform .1s; }
.cat::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 35%, rgba(0,0,0,.85)); border-radius:16px; box-shadow:inset 0 0 0 3px transparent; transition:box-shadow .15s; }
.cat.on::after { box-shadow:inset 0 0 0 4px var(--a1); }
.cat:active { transform:scale(.96); }
.cat span { position:absolute; z-index:1; bottom:8px; right:12px; left:12px; text-align:right; font-size:18px; font-weight:800; }
.cat small { display:block; font-size:12px; font-weight:400; color:#ddd; }
.cat.on::before { content:"✓"; position:absolute; z-index:1; top:8px; left:8px; width:28px; height:28px; border-radius:50%; background:var(--a1); display:grid; place-items:center; font-weight:900; }
#home::after { content:""; position:fixed; z-index:9; left:0; right:0; bottom:0; height:100px; pointer-events:none; background:linear-gradient(transparent, var(--bg) 60%); }
#start { position:fixed; z-index:10; bottom:14px; left:50%; transform:translateX(-50%); white-space:nowrap; padding:14px 44px; border-radius:999px; font-size:20px; font-weight:900; background:linear-gradient(90deg,var(--a1),var(--a2)); box-shadow:0 8px 28px rgba(255,79,139,.45); }
#start:disabled { filter:grayscale(1); opacity:.45; box-shadow:none; }

/* settings */
dialog { margin:auto; border:0; border-radius:20px; padding:0; width:min(440px, 92vw); max-height:94vh; background:var(--panel); color:#fff; }
dialog::backdrop { background:rgba(0,0,0,.65); }
dialog .in { padding:18px 22px; }
dialog h3 { font-size:20px; margin-bottom:6px; }
dialog label { display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; font-size:15px; color:var(--muted); }
dialog label b { font-size:20px; color:#fff; }
.check { gap:12px; margin-top:18px !important; padding-top:14px; border-top:1px solid rgba(255,255,255,.12); }
.check span { color:#fff; font-weight:700; }
.check small { display:block; font-weight:400; color:var(--muted); font-size:13px; }
.check input { width:26px; height:26px; flex:none; accent-color:var(--a1); }

/* rooms */
dialog .hint { color:var(--muted); font-size:14px; line-height:1.4; margin-bottom:4px; }
dialog .txt { display:block; width:100%; margin-top:6px; padding:12px 14px; border:0; border-radius:12px; background:rgba(255,255,255,.1); color:#fff; font:inherit; font-size:18px; -webkit-user-select:text; user-select:text; }
.join { display:flex; gap:8px; align-items:center; }
.join .txt { flex:1; text-align:center; letter-spacing:4px; }
.join .btn { margin:6px 0 0; padding:12px 22px; }
.or { text-align:center; color:var(--muted); margin-top:12px; font-size:14px; }
.err { color:#ff9a9a; text-align:center; min-height:1.2em; margin-top:8px; font-size:14px; }
.code { display:flex; align-items:center; gap:10px; margin:4px 0 8px; color:var(--muted); }
.code b { font-size:26px; color:#fff; letter-spacing:3px; }
#board { width:100%; border-collapse:collapse; font-size:14px; }
#board th { color:var(--muted); font-weight:600; font-size:12px; padding:4px; }
#board td { text-align:center; padding:8px 4px; white-space:nowrap; border-top:1px solid rgba(255,255,255,.1); font-variant-numeric:tabular-nums; }
#board td:first-child, #board th:first-child { text-align:right; }
#board tr.me td { color:var(--a2); font-weight:800; }
dialog .row { justify-content:center; margin-top:14px; }
dialog .row .btn { margin:0; }
.slider { display:flex; align-items:center; gap:10px; direction:ltr; margin-top:4px; }
.slider input { flex:1; height:32px; accent-color:var(--a1); }
.slider button { width:42px; height:42px; flex:none; border-radius:50%; background:rgba(255,255,255,.14); font-size:24px; font-weight:700; }
dialog .btn { display:block; margin:16px auto 0; background:linear-gradient(90deg,var(--a1),var(--a2)); color:#fff; }

/* countdown */
#count { align-items:center; justify-content:center; text-align:center; background:radial-gradient(circle, #3c2b80, var(--bg) 70%); }
#count p { font-size:clamp(18px, 6vh, 32px); color:var(--muted); }
#num { font-size:min(50vh, 40vw); font-weight:900; line-height:1.05; }
#num.pop { animation:pop .9s ease-out; }
@keyframes pop { from { transform:scale(1.6); opacity:0; } 25% { opacity:1; } to { transform:scale(1); } }

/* card */
#card { background:#000; overflow:hidden; }
#bg { position:absolute; inset:-40px; background:center/cover; filter:blur(24px) brightness(.45); }
#pic { position:absolute; top:3vh; left:10vw; width:80vw; height:70vh; object-fit:contain; }
#name { position:absolute; bottom:3vh; left:10vw; right:10vw; text-align:center; font-size:clamp(28px, 13vh, 72px); font-weight:900; line-height:1.1; text-shadow:0 3px 14px #000, 0 0 4px #000; }
#catname { position:absolute; top:12px; right:14px; font-size:13px; padding:5px 12px; border-radius:999px; background:rgba(0,0,0,.5); }
#timer { position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:clamp(20px, 8vh, 40px); font-weight:900; padding:2px 18px; border-radius:999px; background:rgba(0,0,0,.55); direction:ltr; }
#timer.low { background:#dc2626; }
.zone { position:absolute; top:0; bottom:0; width:50%; display:flex; align-items:center; direction:ltr; }
#zOk { right:0; justify-content:flex-end; }
#zSkip { left:0; justify-content:flex-start; }
.zone b { margin:0 10px; padding:10px 12px; border-radius:14px; font-size:14px; text-align:center; opacity:.8; }
#zOk b { background:#16a34a; }
#zSkip b { background:#d97706; }
.x { position:absolute; z-index:5; top:10px; left:12px; width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,.45); font-size:18px; }

/* result */
#result { align-items:center; justify-content:center; gap:2.5vh; text-align:center; padding:16px; }
#result[data-kind=ok] { background:radial-gradient(circle, #16a34a, #052e16 75%); }
#result[data-kind=skip] { background:radial-gradient(circle, #d97706, #2a1503 75%); }
#result[data-kind=time] { background:radial-gradient(circle, #dc2626, #2a0707 75%); }
#verdict { font-size:clamp(30px, 14vh, 80px); font-weight:900; line-height:1; }
#rbox { display:flex; align-items:center; gap:16px; background:rgba(0,0,0,.3); padding:10px 20px 10px 10px; border-radius:16px; }
#rimg { height:28vh; max-width:35vw; border-radius:10px; object-fit:cover; }
#rname { font-size:clamp(20px, 7vh, 36px); font-weight:800; }
#took { font-size:clamp(18px, 5vh, 26px); font-weight:800; }
#stats { color:rgba(255,255,255,.85); font-size:16px; }
.row { display:flex; gap:12px; }
.btn { padding:12px 30px; border-radius:999px; font-size:18px; font-weight:800; background:#fff; color:#111; }
.btn.ghost { background:rgba(255,255,255,.18); color:#fff; }
</style>
</head>
<body>

<section id="home" class="screen on">
  <header>
    <div class="logo" id="logo">GuessIt?</div>
    <div class="grow"></div>
    <button class="pill" id="roomBtn">👥 חדר</button>
    <button class="pill" id="setBtn" onclick="$('settings').showModal()"></button>
    <button class="pill" id="all"></button>
  </header>
  <div id="grid"></div>
  <button id="start"></button>
</section>

<dialog id="settings"><div class="in">
  <h3>⚙️ הגדרות</h3>
  <label>זמן לכל קלף <b id="timeVal"></b></label>
  <div class="slider"><button data-for="time" data-step="-5">−</button><input type="range" id="time" min="0" max="300" step="5"><button data-for="time" data-step="5">+</button></div>
  <label>ספירה לאחור לפני הקלף <b id="prepVal"></b></label>
  <div class="slider"><button data-for="prep" data-step="-1">−</button><input type="range" id="prep" min="1" max="15" step="1"><button data-for="prep" data-step="1">+</button></div>
  <label class="check"><span>🔞 מצב 18+<small>מוסיף קלפים גסים ומביכים לקטגוריות</small></span><input type="checkbox" id="nsfw"></label>
  <button class="btn" autofocus onclick="$('settings').close()">שמור</button>
</div></dialog>

<dialog id="roomDlg"><div class="in">
  <div id="roomOut">
    <h3>👥 חדר חברים</h3>
    <p class="hint">פותחים חדר, שולחים את הקוד לחברים, וכל אחד משחק מהטלפון שלו. כל ניחוש נכנס לטבלה משותפת.</p>
    <label>השם שלך</label>
    <input class="txt" id="rName" maxlength="20" placeholder="איך קוראים לך?" autocomplete="nickname">
    <label>יש לכם קוד?</label>
    <div class="join"><input class="txt" id="rCode" maxlength="5" placeholder="ABCDE" dir="ltr" autocomplete="off" autocapitalize="characters"><button class="btn" id="rJoin">הצטרפות</button></div>
    <div class="or">או</div>
    <button class="btn ghost" id="rNew">פתיחת חדר חדש</button>
    <p class="err" id="rErr"></p>
  </div>
  <div id="roomIn" hidden>
    <h3>👥 <span id="rTitle"></span></h3>
    <div class="code">קוד החדר: <b id="rShow" dir="ltr"></b><button class="pill" id="rShare">שיתוף 🔗</button></div>
    <table id="board"></table>
    <div class="row"><button class="btn" onclick="$('roomDlg').close()">סגירה</button><button class="btn ghost" id="rLeave">יציאה מהחדר</button></div>
  </div>
</div></dialog>

<section id="count" class="screen">
  <button class="x" onclick="goBack()">✕</button>
  <p>שימו את הטלפון על המצח!</p>
  <div id="num"></div>
</section>

<section id="card" class="screen">
  <div id="bg"></div>
  <img id="pic" alt="">
  <div id="name"></div>
  <div id="catname"></div>
  <div id="timer"></div>
  <div class="zone" id="zSkip"><b>✗<br>דלג</b></div>
  <div class="zone" id="zOk"><b>✓<br>ניחש!</b></div>
  <button class="x" onclick="goBack()">✕</button>
</section>

<section id="result" class="screen">
  <div id="verdict"></div>
  <div id="rbox"><img id="rimg" alt=""><div id="rname"></div></div>
  <div id="took"></div>
  <div id="stats"></div>
  <div class="row">
    <button class="btn" onclick="next()">קלף הבא ←</button>
    <button class="btn ghost" onclick="goBack()">לתפריט</button>
  </div>
</section>

<script src="cards.js"></script>
<script type="module" src="room.js"></script>
<script>
const GRACE_MS = 800;   // ignore taps right after the card appears (bumps while lifting)
const VERDICTS = { ok: 'ניחשתם! 🎉', skip: 'דילגתם', time: 'נגמר הזמן! ⏰' };

const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
let cfg = { sel: [], time: 0, prep: 5, nsfw: false };  // time: seconds per card (0 = unlimited), prep: countdown before the card
try { Object.assign(cfg, JSON.parse(localStorage.guessit || '{}')); } catch {}
const saveCfg = () => { try { localStorage.guessit = JSON.stringify(cfg); } catch {} };

// ---------- sound / vibration ----------
let ac;
function beep(freq, ms = 120, type = 'sine', vol = 0.25, delay = 0) {
  try {
    ac ||= new AudioContext();
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + ms / 1000);
  } catch {}
}
const buzz = pattern => { try { navigator.vibrate(pattern); } catch {} };

// ---------- anonymous usage counters, shown at analytics/ (no personal data) ----------
const NS = 'guessit-q7k2m9';
const today = () => new Date().toLocaleDateString('sv', { timeZone: 'Asia/Jerusalem' }).replaceAll('-', '');  // YYYYMMDD
function track(...keys) {
  if (!location.hostname.endsWith('github.io')) return;  // local testing doesn't count
  for (const k of keys) fetch(`https://abacus.jasoncameron.dev/hit/${NS}/${k}`).catch(() => {});
}
track('visits', 'v' + today());
try {
  if (!localStorage.guessitSeen) {
    localStorage.guessitSeen = 1;
    const ua = navigator.userAgent;
    const dev = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios' : /Android/.test(ua) ? 'android' : 'desktop';
    track('visitors', 'dev-' + dev);
  }
} catch {}

// ---------- home ----------
const selected = () => CATEGORIES.filter(c => cfg.sel.includes(c.id));
const pool = c => c.items.filter(i => cfg.nsfw || !i.nsfw);

for (const c of CATEGORIES) {
  const b = document.createElement('button');
  b.className = 'cat';
  b.dataset.id = c.id;
  b.style.backgroundImage = `url("${c.cover}")`;
  b.innerHTML = `<span>${c.name}<small></small></span>`;
  b.onclick = () => {
    cfg.sel = cfg.sel.includes(c.id) ? cfg.sel.filter(id => id !== c.id) : [...cfg.sel, c.id];
    refresh();
  };
  $('grid').append(b);
}
for (const key of ['time', 'prep']) {
  $(key).value = cfg[key];
  $(key).oninput = () => { cfg[key] = +$(key).value; refresh(); };
}
document.querySelectorAll('.slider button').forEach(b => b.onclick = () => {
  const r = $(b.dataset.for);
  r.value = +r.value + +b.dataset.step;  // the browser clamps to min/max
  r.oninput();
});
$('nsfw').checked = cfg.nsfw;
$('nsfw').onchange = () => { cfg.nsfw = $('nsfw').checked; deck = []; refresh(); };
$('settings').onclick = e => { if (e.target === e.currentTarget) e.currentTarget.close(); };  // click outside = save & close
$('all').onclick = () => {
  cfg.sel = selected().length === CATEGORIES.length ? [] : CATEGORIES.map(c => c.id);
  refresh();
};
// Full screen hides the URL bar on Android, but Chrome then shows its own "to exit full screen..." notice for a few
// seconds. Enter it on the first tap in the menu so the notice doesn't cover the countdown. Home-screen installs
// already open full screen, with no notice.
if (!matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)
  addEventListener('click', () => { try { document.documentElement.requestFullscreen().catch(() => {}); } catch {} }, { once: true });
$('start').onclick = () => {
  keepAwake();
  stats = { ok: 0, skip: 0 }; deck = [];
  window.room?.round();
  track('rounds', 'r' + today(), cfg.nsfw ? 'rounds-nsfw' : 'rounds-clean', cfg.time ? 'rounds-timed' : 'rounds-free', ...cfg.sel.map(id => 'cat-' + id));
  next();
};

// keep the screen on while the phone sits on someone's forehead
let wakeLock;
async function keepAwake() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (wakeLock && document.visibilityState === 'visible') keepAwake(); });

function refresh() {
  const sel = selected(), n = sel.reduce((s, c) => s + pool(c).length, 0);
  document.querySelectorAll('.cat').forEach((b, i) => {
    b.classList.toggle('on', cfg.sel.includes(b.dataset.id));
    b.querySelector('small').textContent = `${pool(CATEGORIES[i]).length} קלפים`;
  });
  document.title = $('logo').textContent = cfg.nsfw ? 'אבטל הבולבול' : 'GuessIt?';
  $('timeVal').textContent = cfg.time ? fmt(cfg.time) : 'ללא הגבלה';
  $('prepVal').textContent = `${cfg.prep} שנ׳`;
  $('setBtn').textContent = `⏱ ${cfg.time ? fmt(cfg.time) : 'ללא הגבלה'}${cfg.nsfw ? ' · 🔞' : ''}`;
  $('all').textContent = sel.length === CATEGORIES.length ? 'נקה הכל' : 'בחר הכל';
  $('start').disabled = !n;
  $('start').textContent = n ? `יאללה, מתחילים! (${n} קלפים)` : 'בחרו קטגוריה';
  saveCfg();
}
refresh();

// ---------- game ----------
let deck = [], cur, stats, shownAt = 0, timers = [];
const stopTimers = () => { timers.forEach(clearTimeout); timers = []; }; // clearTimeout also clears intervals (shared timer list per HTML spec)
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function draw() {
  if (!deck.length) deck = shuffle(selected().flatMap(c => pool(c).map(i => ({ ...i, cat: c.name }))));
  return deck.pop();
}

function next() {
  stopTimers();
  cur = draw();
  $('pic').src = $('rimg').src = cur.img;   // loads while the countdown runs
  $('bg').style.backgroundImage = `url("${cur.img}")`;
  $('name').textContent = $('rname').textContent = cur.name;
  $('catname').textContent = cur.cat;
  show('count');
  let n = cfg.prep;
  (function tick() {
    if (!n) return reveal();
    const el = $('num');
    el.textContent = n;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    beep(n === 1 ? 880 : 600, 110);
    n--;
    timers.push(setTimeout(tick, 1000));
  })();
}

function reveal() {
  show('card');
  shownAt = Date.now();
  beep(1046, 300); buzz(120);
  const t = $('timer');
  t.hidden = !cfg.time;
  t.classList.remove('low');
  if (!cfg.time) return;
  let left = cfg.time;
  t.textContent = fmt(left);
  timers.push(setInterval(() => {
    t.textContent = fmt(--left);
    t.classList.toggle('low', left <= 5);
    if (left <= 0) finish('time');
    else if (left <= 5) beep(520, 90);
  }, 1000));
}

function finish(kind) {
  stopTimers();
  const secs = (Date.now() - shownAt) / 1000;
  $('took').textContent = `⏱ ${secs < 60 ? secs.toFixed(1) + ' שניות' : fmt(Math.round(secs)) + ' דקות'}`;
  track('res-' + kind, ...(kind === 'ok' ? ['t' + [60, 30, 20, 10, 5, 0].find(b => secs >= b)] : []));
  if (kind === 'ok') stats.ok++; else stats.skip++;
  window.room?.result(kind, secs, stats.ok);
  if (kind === 'ok') { beep(660, 140); beep(990, 260, 'sine', 0.25, 0.13); buzz(80); }
  else if (kind === 'skip') { beep(330, 220, 'triangle'); buzz(60); }
  else { beep(220, 600, 'sawtooth', 0.15); buzz([200, 100, 200]); }
  $('result').dataset.kind = kind;
  $('verdict').textContent = VERDICTS[kind];
  $('stats').textContent = `ניחושים נכונים: ${stats.ok}  ·  דילוגים: ${stats.skip}`;
  show('result');
}

const tap = kind => () => { if (Date.now() - shownAt > GRACE_MS) finish(kind); };
$('zOk').onclick = tap('ok');
$('zSkip').onclick = tap('skip');

function goBack() {
  stopTimers();
  show('home');
}
</script>
</body>
</html>
